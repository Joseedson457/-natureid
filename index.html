<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NatureID - Identificação de Produtos Naturais</title>
<style>
    body { font-family: Arial, sans-serif; background: #e8f5e9; padding: 40px; text-align: center; }
    h1 { color: #2e7d32; }
    .logo {
        font-size: 40px;
        font-weight: bold;
        color: #1b5e20;
        margin-bottom: 20px;
    }
    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
        width: 80%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        padding: 10px 20px;
        background: #2e7d32;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="logo">🌿 NatureID</div>
<h1>Identificação de Produtos Naturais</h1>

<div class="card">
    <p>Digite o nome do produto natural para ver informações:</p>
    <input placeholder="Ex: cúrcuma, gengibre, mel..." />
    <br>
    <button>Buscar</button>
</div>

</body>
</html>
